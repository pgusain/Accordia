plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.7'        // ← use a real, published version
    id 'io.spring.dependency-management' version '1.1.5'  // compatible with Boot 3.3.x
}


group = 'com.techvisio'
version = '0.0.1-SNAPSHOT'
description = 'accordia executable jar'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(17) }
}

configurations {
    compileOnly { extendsFrom annotationProcessor }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation("org.springframework.boot:spring-boot-starter-data-r2dbc:3.5.7")
    implementation("org.postgresql:r2dbc-postgresql:1.1.0.RELEASE")
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    // optional: pooled connections
    // implementation 'io.r2dbc:r2dbc-pool'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

